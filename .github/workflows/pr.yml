name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/_ci-checks.yml

  live:
    name: Live
    needs: ci
    # Fork PRs get no secrets; the merge queue still runs the live suite for them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_live-tests.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
