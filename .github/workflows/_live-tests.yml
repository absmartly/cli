name: Live API Tests

on:
  workflow_call:
    secrets:
      LIVE_API_URL:
        required: true
      LIVE_API_KEY:
        required: true

jobs:
  live-test:
    name: Live API Tests
    runs-on: ubuntu-latest
    # Every run writes to the same shared test instance; never run two at once.
    concurrency:
      group: live-api-tests
      cancel-in-progress: false
    steps:
      - name: Check live secrets
        env:
          LIVE_API_URL: ${{ secrets.LIVE_API_URL }}
          LIVE_API_KEY: ${{ secrets.LIVE_API_KEY }}
        run: |
          if [ -z "$LIVE_API_URL" ] || [ -z "$LIVE_API_KEY" ]; then
            echo "::error::LIVE_API_URL and LIVE_API_KEY secrets must be set"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install libsecret (keytar build dep)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - run: bun install --frozen-lockfile

      - name: Run live API tests
        run: bun vitest run
        env:
          USE_LIVE_API: '1'
          LIVE_API_URL: ${{ secrets.LIVE_API_URL }}
          LIVE_API_KEY: ${{ secrets.LIVE_API_KEY }}
