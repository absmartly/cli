name: Live API Tests

on:
  workflow_call:
    secrets:
      LIVE_API_URL:
        required: true
      LIVE_API_KEY:
        required: false
      # Preferred over LIVE_API_KEY when set (see src/test/helpers/test-config.ts).
      LIVE_OAUTH_TOKEN:
        required: false

jobs:
  live-test:
    name: Live API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Every run writes to the same shared test instance, so runs from all refs
    # share one group. queue: max keeps every waiting run (FIFO, up to 100)
    # instead of letting a newer pending run replace an older one.
    concurrency:
      group: live-api-tests
      queue: max
    steps:
      - name: Check live secrets
        env:
          LIVE_API_URL: ${{ secrets.LIVE_API_URL }}
          LIVE_API_KEY: ${{ secrets.LIVE_API_KEY }}
          LIVE_OAUTH_TOKEN: ${{ secrets.LIVE_OAUTH_TOKEN }}
        run: |
          if [ -z "$LIVE_API_URL" ] || { [ -z "$LIVE_API_KEY" ] && [ -z "$LIVE_OAUTH_TOKEN" ]; }; then
            echo "::error::Set LIVE_API_URL and one of LIVE_API_KEY or LIVE_OAUTH_TOKEN"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install libsecret (keytar build dep)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - run: bun install --frozen-lockfile

      - name: Run live API tests
        run: bun vitest run
        env:
          USE_LIVE_API: '1'
          LIVE_API_URL: ${{ secrets.LIVE_API_URL }}
          LIVE_API_KEY: ${{ secrets.LIVE_API_KEY }}
          LIVE_OAUTH_TOKEN: ${{ secrets.LIVE_OAUTH_TOKEN }}
